# Publishes the extensions release: every extension on main, packaged deterministically, on one
# rolling GitHub Release tagged `extensions`. The app reads `catalog.json` from that release and
# downloads each `.atatextension` from the URL the catalog names, so the release is the directory
# and nothing else has to run anywhere.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extensions-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Publish to the extensions release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view extensions >/dev/null 2>&1; then
            gh release create extensions --title "Extensions" \
              --notes "The extensions the app's Extensions pane offers. Rewritten on every push to main."
          fi
          gh release upload extensions dist/artifacts/* --clobber
